domain: physics
order: 5
title: "Statistical Mechanics"
origin: "Statistical mechanics can be built from one idea, that a probability distribution should claim no more than is known, and followed through ensembles, gases that condense, magnets that order, and the symmetry and dimension arguments that explain which of them can. The Ising model reappears in the course on AI models for physics as an energy function and a sampling problem."
summary: "Statistical mechanics from information theory: ensembles, interacting systems and the Ising model, phase transitions and broken symmetry."
