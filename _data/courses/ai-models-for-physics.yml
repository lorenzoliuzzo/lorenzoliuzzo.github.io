# No labs or notebooks were found for this course; the project is its practical.
# `labs` is planning data: the layout does not render it yet.
domain: ai
order: 5
title: AI Models for Physics
origin: An influential line of neural-network models was built by borrowing the energy function of a model of magnets and analysed with the tools of statistical mechanics (Hopfield, 1982; Ackley, Hinton and Sejnowski, 1985). That is why this course starts with spins.
summary: 'Where machine learning and physics meet: graphs, models borrowed from statistical physics and their samplers, and networks that learn physical systems.'
parts:
- title: Graphs
  blurb: Graphs as data, and networks that learn on them.
  notes:
  - ai/ai-models-for-physics/graphs-and-adjacency
  - ai/ai-models-for-physics/graph-embedding
  - ai/ai-models-for-physics/spectral-graph-analysis
  - ai/ai-models-for-physics/graph-nn
  - ai/ai-models-for-physics/explicit-model-representations
- title: Ising model and sampling
  blurb: The spin model, its statistics, and the Markov chains that sample it.
  notes:
  - ai/ai-models-for-physics/ising-lenz-model
  - ai/ai-models-for-physics/ensembles-and-partition-function
  - ai/ai-models-for-physics/mean-field-ising
  - ai/ai-models-for-physics/markov-processes
  - ai/ai-models-for-physics/random-walk-and-metropolis
- title: Energy-based models
  blurb: Learning with a Boltzmann distribution.
  notes:
  - ai/ai-models-for-physics/boltzmann-machines
  - ai/ai-models-for-physics/gibbs-sampling
  - ai/ai-models-for-physics/contrastive-divergence
  - ai/ai-models-for-physics/hopfield-as-spin-glass
  - ai/ai-models-for-physics/wolff-and-cluster-updates
- title: Learning to act and reservoirs
  blurb: Dynamics and decisions.
  notes:
  - ai/ai-models-for-physics/markov-decision-process
  - ai/ai-models-for-physics/reinforcement-learning
  - ai/ai-models-for-physics/reservoir-computing
- title: Networks for physical systems
  blurb: Networks that respect the physics of their data.
  notes:
  - ai/ai-models-for-physics/physics-informed-nn
  - ai/ai-models-for-physics/convolutional-nn
- title: Neural differential equations
  blurb: Networks whose layers are solutions of ODEs, and the physics they can be built to respect.
  reading:
  - chen-2018
  - greydanus-2019
  - cranmer-2020
  notes:
  - ai/ai-models-for-physics/neural-odes
  - ai/ai-models-for-physics/adjoint-sensitivity-method
  - ai/ai-models-for-physics/hamiltonian-nn
  - ai/ai-models-for-physics/lagrangian-nn
labs:
- id: project
  title: Quantum vs classical computation at phase transitions
  tool: numpy, scipy, TeNPy
  source: M4P/project
  phases: 7
  notes:
  - ising-lenz-model
  - mean-field-ising
  - random-walk-and-metropolis
  - hopfield-as-spin-glass
  - wolff-and-cluster-updates
  covers: exact baselines, Metropolis and Wolff sampling, mean-field and variational methods, the Hopfield narrative; phases 0 to 6 complete, phase 7 is the report
- id: node-assignment
  title: Lagrangian and Hamiltonian neural ODEs (assignment)
  tool: 'Julia: Lux, DiffEqFlux, OrdinaryDiffEq'
  source: github.com/lorenzoliuzzo/NODE
  phases: 0
  notes:
  - neural-odes
  - hamiltonian-nn
  - lagrangian-nn
  - adjoint-sensitivity-method
  covers: a Hamiltonian network fitted to an oscillator, a Lagrangian network with a neural ODE layer and the interpolating adjoint; unfinished; the LaTeX report holds the adjoint derivation
