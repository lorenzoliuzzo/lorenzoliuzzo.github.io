# Statistics and Statistical Learning. One file per course: the file name is the course's
# slug and its page is /notes/statistics/. See .claude/skills/plan-course-notes/.
domain: mathematics
order: 1
title: "Statistics and Statistical Learning"
short: "Statistics"
summary: "Probability and statistical inference, then regression, classification, model assessment and multivariate methods, in reading order."
reference: /assets/notes/statistics/statistics-reference/statistics-reference.pdf
parts:
  - title: "Probability"
    blurb: "Events, random variables and the standard distributions: the language the rest is written in."
    notes:
      - statistics/probability-foundations
      - statistics/random-variables
      - statistics/common-random-variables
  - title: "Inference"
    blurb: "From a sample back to the mechanism: how far an estimate can be off, how to build one, and how to decide between claims."
    notes:
      - statistics/sampling-distributions
      - statistics/point-estimation
      - statistics/confidence-intervals
      - statistics/hypothesis-tests
  - title: "Regression and smoothing"
    blurb: "Predicting a number from inputs, from straight lines to flexible curves, and how to keep them from overfitting."
    notes:
      - statistics/linear-regression
      - statistics/regression-diagnostics
      - statistics/regularization
      - statistics/splines
      - statistics/gam-mars
      - statistics/robust-statistics
  - title: "Classification and trees"
    blurb: "Predicting a label: linear boundaries, trees, and ensembles of trees."
    notes:
      - statistics/linear-classification
      - statistics/decision-trees
      - statistics/bagging-random-forests
      - statistics/boosting
  - title: "Assessing models"
    blurb: "How well a fitted model will do on new data, and how sure you can be."
    notes:
      - statistics/model-assessment
      - statistics/conformal-prediction
  - title: "Multivariate methods"
    blurb: "Structure in many variables at once: directions of variation and hidden groups."
    notes:
      - statistics/pca-factor-analysis
      - statistics/mixture-models
