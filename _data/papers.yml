# The site's one bibliography. A note cites a work in the text with {% cite id %} (numbered,
# in order of first appearance) or {% citet id %} (author and year, then the number), and may
# list further works in front matter with `cites: [id, ...]`; the reference list at the end of
# the note is built from both. The back-links on /references/ are built from the same tags.
#
# Required: id (lower-case, hyphenated: surname-year, add -b for a second one), title,
#           authors ("A. B. Surname, C. Surname"; more than five may end "et al."), year.
# Optional: type (article, book, preprint, thesis, report, software, dataset), venue ("PNAS 79(8)"),
#           pages, doi (bare, "10.1073/..."), arxiv (bare, "1706.03762"), url,
#           why (one sentence on why a reader of the notes should care about this work),
#           unverified (true until the details above have been checked against the source;
#           tools/check_notes.rb warns while it is set).
