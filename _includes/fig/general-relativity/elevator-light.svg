<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-size="13"><rect x="90" y="40" width="380" height="210" rx="0" class="f-box"/><line x1="90" y1="40" x2="90" y2="250" class="f-line"/><path d="M90,110 L99.5,110.1 L109,110.3 L118.5,110.6 L128,111.1 L137.5,111.7 L147,112.5 L156.5,113.4 L166,114.4 L175.5,115.6 L185,116.9 L194.5,118.3 L204,119.9 L213.5,121.6 L223,123.5 L232.5,125.5 L242,127.6 L251.5,129.9 L261,132.3 L270.5,134.8 L280,137.5 L289.5,140.3 L299,143.3 L308.5,146.4 L318,149.6 L327.5,153 L337,156.5 L346.5,160.1 L356,163.9 L365.5,167.8 L375,171.9 L384.5,176.1 L394,180.4 L403.5,184.9 L413,189.5 L422.5,194.2 L432,199.1 L441.5,204.1 L451,209.3 L460.5,214.6 L470,220" class="f-a-line"/><line x1="90" y1="110" x2="470" y2="110" class="f-line f-dash"/><line x1="280" y1="245" x2="280" y2="205" class="f-b-line"/><path d="M280,205 L276.4,213 L283.6,213 Z" class="f-arrow"/><text x="290" y="232" font-size="13" text-anchor="start" class="f-ink"><tspan class="f-i">a</tspan> = <tspan class="f-i">g</tspan></text><text x="520" y="80" font-size="13" text-anchor="start" class="f-ink">Equivalence principle:</text><text x="520" y="106" font-size="12.5" text-anchor="start" class="f-muted">in the accelerating box the beam</text><text x="520" y="124" font-size="12.5" text-anchor="start" class="f-muted">bends as <tspan class="f-i">y</tspan> = −<tspan class="f-i">ax</tspan><tspan font-size="75%" dy="-5">2</tspan><tspan dy="5"> / (2</tspan><tspan class="f-i">c</tspan><tspan font-size="75%" dy="-5">2</tspan><tspan dy="5">).</tspan></text><text x="520" y="150" font-size="12.5" text-anchor="start" class="f-muted">A frame at rest in a gravitational</text><text x="520" y="168" font-size="12.5" text-anchor="start" class="f-muted">field <tspan class="f-i">g</tspan> cannot tell the difference,</text><text x="520" y="186" font-size="12.5" text-anchor="start" class="f-muted">so light falls there too.</text><text x="520" y="220" font-size="12.5" text-anchor="start" class="f-muted">Not to scale: over 1 m the drop</text><text x="520" y="238" font-size="12.5" text-anchor="start" class="f-muted">is 5.5×10<tspan font-size="75%" dy="-5">−17</tspan><tspan dy="5"> m.</tspan></text></svg>