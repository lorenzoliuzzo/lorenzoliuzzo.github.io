<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-size="13"><line x1="52" y1="252" x2="532" y2="252" class="f-grid"/><line x1="52" y1="169.1" x2="532" y2="169.1" class="f-grid"/><line x1="52" y1="86.3" x2="532" y2="86.3" class="f-grid"/><line x1="52" y1="252" x2="532" y2="252" class="f-axis"/><line x1="52" y1="20" x2="52" y2="252" class="f-axis"/><line x1="148" y1="252" x2="148" y2="256" class="f-axis"/><text x="148" y="270" font-size="12" text-anchor="middle" class="f-muted">−1</text><line x1="244" y1="252" x2="244" y2="256" class="f-axis"/><text x="244" y="270" font-size="12" text-anchor="middle" class="f-muted">0</text><line x1="340" y1="252" x2="340" y2="256" class="f-axis"/><text x="340" y="270" font-size="12" text-anchor="middle" class="f-muted">1</text><line x1="436" y1="252" x2="436" y2="256" class="f-axis"/><text x="436" y="270" font-size="12" text-anchor="middle" class="f-muted">2</text><text x="44" y="256" font-size="12" text-anchor="end" class="f-muted">0</text><text x="44" y="173.1" font-size="12" text-anchor="end" class="f-muted">0.25</text><text x="44" y="90.3" font-size="12" text-anchor="end" class="f-muted">0.5</text><text x="292" y="290" font-size="13" text-anchor="middle" class="f-muted">outcome (eigenvalue of <tspan class="f-i">A</tspan>)</text><text x="12" y="12" font-size="13" text-anchor="start" class="f-muted">probability</text><rect x="126" y="185.7" width="44" height="66.3" rx="0" class="f-a-fill"/><rect x="222" y="86.3" width="44" height="165.7" rx="0" class="f-a-fill"/><rect x="414" y="152.6" width="44" height="99.4" rx="0" class="f-a-fill"/><line x1="282.4" y1="252" x2="282.4" y2="46.5" class="f-a-line"/><line x1="175.5" y1="46.5" x2="389.3" y2="46.5" class="f-a-line"/><text x="282.4" y="31.6" font-size="12.5" text-anchor="middle" class="f-a">⟨<tspan class="f-i">A</tspan>⟩ = 0.4, Δ<tspan class="f-i">A</tspan> = 1.11</text><text x="560" y="70" font-size="12.5" text-anchor="start" class="f-muted">Bars: |⟨<tspan class="f-i">a</tspan>|ψ⟩|², the Born</text><text x="560" y="88" font-size="12.5" text-anchor="start" class="f-muted">probabilities of each eigenvalue.</text><text x="560" y="122" font-size="12.5" text-anchor="start" class="f-ink">⟨<tspan class="f-i">A</tspan>⟩ = Σ <tspan class="f-i">a</tspan> <tspan class="f-i">p</tspan>(<tspan class="f-i">a</tspan>) = ⟨ψ|<tspan class="f-i">A</tspan>|ψ⟩</text><text x="560" y="146" font-size="12.5" text-anchor="start" class="f-ink">Δ<tspan class="f-i">A</tspan>² = ⟨<tspan class="f-i">A</tspan>²⟩ − ⟨<tspan class="f-i">A</tspan>⟩² = 1.24</text><text x="560" y="180" font-size="12.5" text-anchor="start" class="f-muted">The spread is zero only if the state</text><text x="560" y="198" font-size="12.5" text-anchor="start" class="f-muted">is an eigenvector of <tspan class="f-i">A</tspan>.</text></svg>