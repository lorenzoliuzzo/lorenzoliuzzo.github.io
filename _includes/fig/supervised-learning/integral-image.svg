<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-size="13"><rect x="60" y="30" width="310" height="200" rx="0" class="f-box"/><rect x="210" y="110" width="130" height="90" rx="0" class="f-b-fill"/><line x1="210" y1="30" x2="210" y2="230" class="f-grid"/><line x1="60" y1="110" x2="370" y2="110" class="f-grid"/><line x1="340" y1="30" x2="340" y2="230" class="f-grid"/><line x1="60" y1="200" x2="370" y2="200" class="f-grid"/><text x="120" y="70" font-size="18" text-anchor="middle" font-weight="600" class="f-ink">A</text><text x="275" y="70" font-size="18" text-anchor="middle" font-weight="600" class="f-ink">B</text><text x="120" y="159" font-size="18" text-anchor="middle" font-weight="600" class="f-ink">C</text><text x="275" y="159" font-size="18" text-anchor="middle" font-weight="600" class="f-b">D</text><circle cx="210" cy="110" r="4.5" class="f-a-solid"/><text x="202" y="104" font-size="13" text-anchor="end" font-weight="600" class="f-a">1</text><circle cx="340" cy="110" r="4.5" class="f-a-solid"/><text x="348" y="104" font-size="13" text-anchor="start" font-weight="600" class="f-a">2</text><circle cx="210" cy="200" r="4.5" class="f-a-solid"/><text x="202" y="216" font-size="13" text-anchor="end" font-weight="600" class="f-a">3</text><circle cx="340" cy="200" r="4.5" class="f-a-solid"/><text x="348" y="216" font-size="13" text-anchor="start" font-weight="600" class="f-a">4</text><text x="60" y="22" font-size="12.5" text-anchor="start" class="f-muted">the image, with the top-left corner at its origin</text><text x="430" y="70" font-size="13" text-anchor="start" class="f-ink">ii(1) = A</text><text x="430" y="92" font-size="13" text-anchor="start" class="f-ink">ii(2) = A + B</text><text x="430" y="114" font-size="13" text-anchor="start" class="f-ink">ii(3) = A + C</text><text x="430" y="136" font-size="13" text-anchor="start" class="f-ink">ii(4) = A + B + C + D</text><text x="430" y="178" font-size="14" text-anchor="start" font-weight="600" class="f-b">D = ii(4) + ii(1) − ii(2) − ii(3)</text><text x="430" y="202" font-size="12.5" text-anchor="start" class="f-muted">Four lookups, whatever the size of D.</text></svg>