<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-size="13"><path d="M70,262 L400,262 L520,168 L190,168 Z" class="f-a-fill"/><path d="M70,262 L400,262 L520,168 L190,168 Z" class="f-axis"/><line x1="150" y1="236" x2="340" y2="214" class="f-a-line"/><path d="M340,214 L331.6,211.3 L332.5,218.5 Z" class="f-arrow"/><line x1="150" y1="236" x2="340" y2="82" class="f-line"/><path d="M340,82 L331.5,84.2 L336.1,89.8 Z" class="f-arrow"/><line x1="340" y1="212" x2="340" y2="85" class="f-b-line f-dash"/><path d="M340,85 L336.4,93 L343.6,93 Z" class="f-arrow"/><path d="M327.1,215.5 L327.1,202.5 L340,201" class="f-axis"/><circle cx="150" cy="236" r="3.2" class="f-ink"/><circle cx="340" cy="214" r="4" class="f-a-solid"/><circle cx="340" cy="82" r="4" class="f-ink"/><text x="350" y="86" font-size="15" text-anchor="start" font-weight="600" class="f-ink">y</text><text x="350" y="234" font-size="14" text-anchor="start" font-weight="600" class="f-a">ŷ = Hy</text><text x="352" y="150" font-size="14" text-anchor="start" font-weight="600" class="f-b">e = y − ŷ</text><text x="138" y="252" font-size="13" text-anchor="start" class="f-muted">0</text><text x="404" y="252" font-size="12.5" text-anchor="end" class="f-muted">span of the columns of X</text><text x="556" y="92" font-size="12.5" text-anchor="start" class="f-muted">The fit is the point of the plane</text><text x="556" y="111" font-size="12.5" text-anchor="start" class="f-muted">closest to y, so the residual is</text><text x="556" y="130" font-size="12.5" text-anchor="start" class="f-muted">perpendicular to every column of X:</text><text x="556" y="149" font-size="12.5" text-anchor="start" class="f-muted">Xᵀe = 0. These are the normal</text><text x="556" y="168" font-size="12.5" text-anchor="start" class="f-muted">equations, and the coordinates of ŷ</text><text x="556" y="187" font-size="12.5" text-anchor="start" class="f-muted">in the columns are the coefficients.</text></svg>