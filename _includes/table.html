<figure class="latex-like-table" id="{{ include.id }}">
  <div class="table-wrapper" 
       data-url="{{ include.url | relative_url }}" 
       data-cols="{{ include.columns | default: 99 }}">
    <div class="loading-spinner">Loading table...</div>
  </div>
  <figcaption>{{ include.caption }}</figcaption>
</figure>

<script>
  (function() {
    // Target ONLY the wrapper immediately preceding this specific script
    const currentScript = document.currentScript;
    const wrapper = currentScript.previousElementSibling.querySelector('.table-wrapper');
    
    if (!wrapper) return;

    const url = wrapper.getAttribute('data-url');
    const maxCols = parseInt(wrapper.getAttribute('data-cols'));
    
    fetch(url)
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').map(row => row.split(','));
        let html = '<table><thead><tr>';
                  
        const headerRow = rows[0].slice(0, maxCols);
        headerRow.forEach((cell, i) => {
          const val = cell.trim();
          if (i === 0 && (val === "" || val.toLowerCase() === "index")) {
            html += '<th></th>'; 
          } else {
            html += `<th><strong>${val}</strong></th>`;
          }
        });
        
        html += '</tr></thead><tbody>';
        
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i].slice(0, maxCols);
          if (cells.length === 0 || (cells.length === 1 && cells[0] === "")) continue;
          
          html += '<tr>';
          cells.forEach(cell => {
            html += `<td>${cell.trim()}</td>`;
          });
          html += '</tr>';
        }
        
        html += '</tbody></table>';
        wrapper.innerHTML = html;
        
        // Trigger the reference update now that THIS table exists in the DOM
        if (window.updateReferences) {
          window.updateReferences();
        }
      })
      .catch(err => {
        wrapper.innerHTML = `<p style="color:red;">Error loading table: ${err.message}</p>`;
      });

  })();
</script>
