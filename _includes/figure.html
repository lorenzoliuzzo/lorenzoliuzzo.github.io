<figure class="latex-like-figure" id="{{ include.id }}">
  <img src="{{ include.url | relative_url }}" alt="{{ include.caption }}">
  <figcaption>
    <span class="caption-label"></span> {{ include.caption }}
  </figcaption>
</figure>
