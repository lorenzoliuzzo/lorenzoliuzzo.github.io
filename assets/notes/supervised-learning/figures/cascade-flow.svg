<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-size="13"><style>.f-ink{fill:#1b1f23}.f-muted{fill:#5f6971}.f-faint{fill:#8a939b}.f-i{font-style:italic}.f-axis{stroke:#5f6971;stroke-width:1.2;fill:none}.f-grid{stroke:#e3dfd5;stroke-width:1;fill:none}.f-line{stroke:#1b1f23;stroke-width:1.4;fill:none}.f-dash{stroke-dasharray:5 4}.f-arrow{fill:#5f6971}.f-box{fill:#ffffff;stroke:#bdb7aa;stroke-width:1.2}.f-a{fill:#26647f}.f-a-line{stroke:#26647f;stroke-width:2.2;fill:none}.f-a-fill{fill:#26647f;fill-opacity:.22;stroke:none}.f-a-solid{fill:#26647f;stroke:none}.f-b{fill:#b4581f}.f-b-line{stroke:#b4581f;stroke-width:2.2;fill:none}.f-b-fill{fill:#b4581f;fill-opacity:.22;stroke:none}.f-b-solid{fill:#b4581f;stroke:none}.f-c{fill:#2f7d52}.f-c-line{stroke:#2f7d52;stroke-width:2.2;fill:none}.f-c-fill{fill:#2f7d52;fill-opacity:.22;stroke:none}.f-c-solid{fill:#2f7d52;stroke:none}.f-d{fill:#7b4f9d}.f-d-line{stroke:#7b4f9d;stroke-width:2.2;fill:none}.f-d-fill{fill:#7b4f9d;fill-opacity:.22;stroke:none}.f-d-solid{fill:#7b4f9d;stroke:none}.f-e{fill:#a63a62}.f-e-line{stroke:#a63a62;stroke-width:2.2;fill:none}.f-e-fill{fill:#a63a62;fill-opacity:.22;stroke:none}.f-e-solid{fill:#a63a62;stroke:none}text{font-family:"Libertinus Serif","New Computer Modern",serif}</style><text x="36" y="28" font-size="13" text-anchor="start" font-weight="600" class="f-ink">windows reaching each stage, if every stage passes 30% of them</text><rect x="36" y="54" width="118" height="60" rx="0" class="f-a-fill"/><rect x="36" y="54" width="118" height="60" rx="0" class="f-a-line"/><text x="95" y="79" font-size="13.5" text-anchor="middle" font-weight="600" class="f-ink">stage 1</text><text x="95" y="99" font-size="12" text-anchor="middle" class="f-muted">cheapest</text><text x="95" y="46" font-size="13" text-anchor="middle" class="f-ink">100,000</text><line x1="95" y1="118" x2="95" y2="172" class="f-b-line"/><path d="M95,172 L98.6,164 L91.4,164 Z" class="f-arrow"/><text x="95" y="190" font-size="12.5" text-anchor="middle" class="f-b">rejected: 70,000</text><rect x="192" y="54" width="118" height="60" rx="0" class="f-a-fill"/><rect x="192" y="54" width="118" height="60" rx="0" class="f-a-line"/><text x="251" y="79" font-size="13.5" text-anchor="middle" font-weight="600" class="f-ink">stage 2</text><text x="251" y="46" font-size="13" text-anchor="middle" class="f-ink">30,000</text><line x1="158" y1="84" x2="188" y2="84" class="f-line"/><path d="M188,84 L180,80.4 L180,87.6 Z" class="f-arrow"/><line x1="251" y1="118" x2="251" y2="172" class="f-b-line"/><path d="M251,172 L254.6,164 L247.4,164 Z" class="f-arrow"/><text x="251" y="190" font-size="12.5" text-anchor="middle" class="f-b">rejected: 21,000</text><rect x="348" y="54" width="118" height="60" rx="0" class="f-a-fill"/><rect x="348" y="54" width="118" height="60" rx="0" class="f-a-line"/><text x="407" y="79" font-size="13.5" text-anchor="middle" font-weight="600" class="f-ink">stage 3</text><text x="407" y="46" font-size="13" text-anchor="middle" class="f-ink">9,000</text><line x1="314" y1="84" x2="344" y2="84" class="f-line"/><path d="M344,84 L336,80.4 L336,87.6 Z" class="f-arrow"/><line x1="407" y1="118" x2="407" y2="172" class="f-b-line"/><path d="M407,172 L410.6,164 L403.4,164 Z" class="f-arrow"/><text x="407" y="190" font-size="12.5" text-anchor="middle" class="f-b">rejected: 6,300</text><rect x="504" y="54" width="118" height="60" rx="0" class="f-a-fill"/><rect x="504" y="54" width="118" height="60" rx="0" class="f-a-line"/><text x="563" y="79" font-size="13.5" text-anchor="middle" font-weight="600" class="f-ink">stage 4</text><text x="563" y="99" font-size="12" text-anchor="middle" class="f-muted">costliest</text><text x="563" y="46" font-size="13" text-anchor="middle" class="f-ink">2,700</text><line x1="470" y1="84" x2="500" y2="84" class="f-line"/><path d="M500,84 L492,80.4 L492,87.6 Z" class="f-arrow"/><line x1="563" y1="118" x2="563" y2="172" class="f-b-line"/><path d="M563,172 L566.6,164 L559.4,164 Z" class="f-arrow"/><text x="563" y="190" font-size="12.5" text-anchor="middle" class="f-b">rejected: 1,890</text><line x1="618" y1="84" x2="642" y2="84" class="f-line"/><path d="M642,84 L634,80.4 L634,87.6 Z" class="f-arrow"/><text x="630" y="72" font-size="13" text-anchor="start" class="f-ink">810</text><text x="630" y="102" font-size="12" text-anchor="start" class="f-muted">passed all:</text><text x="630" y="118" font-size="12" text-anchor="start" class="f-muted">faces</text><text x="36" y="250" font-size="12.5" text-anchor="start" class="f-muted">A window that survives every stage is reported as a face; one that fails any stage is dropped at once.</text></svg>