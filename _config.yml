plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-spaceship
  - jekyll-last-modified-at

remote_theme: "mmistakes/minimal-mistakes@4.27.0"
minimal_mistakes_skin: "default"

title: "Lorenzo Liuzzo"
email: lorenzoliuzzo@outlook.com
description: "My personal website." 
baseurl: "" 
url: "https://lorenzoliuzzo.github.io" 

author:
  name: "Lorenzo Liuzzo"
  avatar: "assets/images/profile.jpg"
  bio: ""
  location: "Milan, Italy"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lorenzoliuzzo@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzoliuzzo"

time_zone: Europe/Rome
date_format: "%Y-%m-%d"

back_to_top: true
back_to_top_text: "Back to top"

words_per_minute: 250

search: true
lunr:
  search_within_pages: true

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lorenzoliuzzo@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzoliuzzo"

footer_content: "Copyright &copy; 2026 Lorenzo Liuzzo"

# atom_feed:
  # hide: true
  

collections: 
  notes: 
    output: true
    permalink: /:collection/:path/

  projects: 
    output: true
    permalink: /:collection/:path/


defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      back_to_top: true

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: true
      back_to_top: true

  - scope:
      path: ""
      type: notes
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: true
      back_to_top: true

  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: true
      back_to_top: true