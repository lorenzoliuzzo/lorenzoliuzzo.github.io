  #   values:
  #     read_time: true
  #     back_to_top: true
  #     sidebar:
  #       nav: "mc-raytracing-toc"


tag_archive:
  type: liquid
  path: /tags/


footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lorenzoliuzzo@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzoliuzzo"

footer_content: "Copyright &copy; 2026 Lorenzo Liuzzo"