# _config.yml

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-spaceship
  - jekyll-last-modified-at

remote_theme: "mmistakes/minimal-mistakes@4.27.0"
minimal_mistakes_skin: "default"

markdown: kramdown
mathjax: true

sass:
  style: compressed

search: true
words_per_minute: 150

# Where the "From Friends" form on /about/ posts (a Formspree form URL, or any service
# that takes a multipart POST and answers JSON). Left empty the form is replaced by a
# mailto line, so the section stays usable until this is filled in.
friends_form_endpoint: "https://formspree.io/f/xaqrrwnp"

# reCAPTCHA v2 SITE key for that form — public by design: it ships in the page HTML for
# every visitor to read, and it is domain-locked, so committing it here is fine. The
# matching SECRET key is pasted into Formspree (Settings → CAPTCHA → Custom reCAPTCHA),
# which is where the token is verified server-side; it must never live in this repo.
# Empty renders no challenge.
recaptcha_site_key: "6LfJ7nEtAAAAAPxCXiQfqWOxr2QEBlso10a2-pdG"


title: "Lorenzo Liuzzo"
email: lorenzoliuzzo@outlook.com
description: "Notes and projects at the intersection of physics, machine learning and software engineering."
baseurl: ""
url: "https://lorenzoliuzzo.github.io"

# Masthead mark, and the card shown when a link to the site is unfurled by Slack,
# Twitter or LinkedIn. Both are generated by tools/make-brand-assets.py.
logo: "/assets/images/monogram-32.png"
og_image: "/assets/images/og-card.png"
og_image_alt: "Lorenzo Liuzzo — notes and projects at the intersection of physics, machine learning and software."

author:
  name: "Lorenzo Liuzzo"
  avatar: "assets/images/profile.jpg"
  bio: ""
  location: "Milan, Italy"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lorenzoliuzzo@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzoliuzzo"

time_zone: Europe/Rome
date_format: "%Y-%m-%d"

include:
  - _pages

# Setting `exclude` replaces Jekyll's defaults rather than adding to them, so the
# default entries are repeated here — without them vendor/bundle would be published.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .venv
  - LICENSE
  # Local authoring tool: holds the Anthropic API key and can write to _notes/.
  # It must never be served.
  - tools

collections:
  projects: 
    output: true
    path: "_projects"
    permalink: /:collection/:path/

  notes:
    output: true
    path: "_notes"
    permalink: /:collection/:path/

  library:
    output: true
    path: "_library"
    permalink: /:collection/:path/

  travel:
    output: true
    path: "_travel"
    permalink: /:collection/:path/


defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      show_date: true
      back_to_top: true

  - scope:
      path: "_notes"
      type: notes
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: true
      back_to_top: true
      show_taxonomy: true
      # The theme's "related" block only ever draws from site.posts, and this site
      # has none — it rendered as a "You may also enjoy" heading over nothing.
      related: false
      breadcrumbs: true
      # Every note gets the on-this-page rail; the stub notes that have no
      # headings yet collapse it away in CSS rather than showing an empty box.
      toc: true
      toc_sticky: true
      # Provenance defaults. Most notes here start as an AI draft, so that is the
      # honest default; what the reader needs to know is whether a human has since
      # read it end to end, which is `human_verified` and is never assumed.
      # Overridden per note by the MyThingsLab drawer (tools/mythingslab).
      ai_generated: true
      human_verified: false

  - scope:
      path: "_library"
      type: library
    values:
      layout: single
      author_profile: false
      # The date is rendered by book-meta.html, labelled by reading status, so the
      # theme's bare calendar line would only repeat it without saying what it means.
      show_date: false
      read_time: false
      back_to_top: true
      breadcrumbs: true
      related: false
      # Same provenance contract as notes: the write-up under a book is a draft
      # until it has been read back and signed off from the MyThingsLab drawer.
      ai_generated: true
      human_verified: false

  - scope:
      path: "_projects"
      type: projects
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: false
      back_to_top: true
      breadcrumbs: true

  - scope:
      path: "_travel"
      type: travel
    values:
      # The travel layout draws the trip's own map above the prose; it wraps
      # `single`, so everything else here is the same deal the other collections get.
      layout: travel
      author_profile: false
      # The dates are rendered by trip-meta.html as a labelled start–end span, so
      # the theme's bare calendar line would only repeat half of it. Same call the
      # library makes for the same reason.
      show_date: false
      read_time: false
      back_to_top: true
      breadcrumbs: true
      # Loads Leaflet from the CDN. Set on the layout's pages rather than
      # site-wide so no other page pays for a map library it never uses.
      travel_map: true


# Collections the local MyThingsLab drawer can chat about and write to, and so also
# the collections that carry a provenance badge — the badge records a sign-off that
# only the drawer can make. Must match EDITABLE_COLLECTIONS in tools/mythingslab/core.mjs.
mythingslab_collections:
  - notes
  - library


tag_archive:
  type: liquid
  path: /tags/


footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:lorenzoliuzzo@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/lorenzoliuzzo"

footer_content: "Copyright &copy; 2026 Lorenzo Liuzzo"